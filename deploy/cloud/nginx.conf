# =============================================================================
# IRIS Nginx Configuration
# Place at: /etc/nginx/sites-available/iris
# Enable:   ln -s /etc/nginx/sites-available/iris /etc/nginx/sites-enabled/iris
#           nginx -t && systemctl reload nginx
# =============================================================================

# --- Upstream definitions -----------------------------------------------------
upstream iris_api {
    server 127.0.0.1:8767;      # FastAPI (serves React SPA + REST + WebSocket)
    keepalive 64;
}

# --- Rate limiting zones -------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m  rate=10r/s;

# =============================================================================
# HTTP — redirect to HTTPS (or serve directly if SSL not yet configured)
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name _;        # replace with your domain e.g. iris.kushals.com

    # -----------------------------------------------------------------
    # Uncomment the two lines below once SSL is configured via certbot:
    # -----------------------------------------------------------------
    # return 301 https://$host$request_uri;

    # -----------------------------------------------------------------
    # Comment out the location blocks below once SSL redirect is active.
    # -----------------------------------------------------------------

    access_log  /var/log/nginx/iris_access.log combined;
    error_log   /var/log/nginx/iris_error.log  warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/html
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # --- Static assets (React build) with long-lived cache ---
    location /assets/ {
        proxy_pass http://iris_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # --- WebSocket / live status channels ---
    location /ws/ {
        proxy_pass         http://iris_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API routes ---
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass         http://iris_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Buffer tuning for large JSON payloads (image metadata, reports)
        proxy_buffer_size        16k;
        proxy_buffers            8 16k;
        proxy_busy_buffers_size  32k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY"    always;
    }

    # --- Everything else → React SPA (client-side routing) ---
    location / {
        limit_req zone=web_limit burst=20 nodelay;

        proxy_pass         http://iris_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

